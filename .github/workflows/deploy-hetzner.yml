name: Deploy to Hetzner Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    name: Deploy to Hetzner Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.HETZNER_SERVER_USER }}
          SERVER_IP: ${{ secrets.HETZNER_SERVER_IP }}
          APP_DIR: ${{ secrets.HETZNER_APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_IP} << 'ENDSSH'
            set -e
            echo "🚀 Starting deployment..."
            
            # Navigate to app directory
            cd ${APP_DIR:-~/bar-app} || cd ~/office-app || exit 1
            
            # Pull latest changes
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            # Install/update dependencies
            echo "📦 Installing dependencies..."
            npm ci --production=false
            
            # Build Next.js app
            echo "🔨 Building Next.js application..."
            npm run build || echo "⚠️ Build failed, continuing..."
            
            # Restart application (if using PM2)
            if command -v pm2 &> /dev/null; then
              echo "🔄 Restarting application with PM2..."
              pm2 restart office-app || pm2 restart bar-app || pm2 start npm --name "office-app" -- start || echo "⚠️ PM2 restart failed"
            else
              echo "ℹ️ PM2 not found, skipping restart"
              echo "⚠️ Please restart the application manually"
            fi
            
            echo "✅ Deployment completed!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "✅ Deployment workflow completed"
          echo "Check your server to ensure the application is running"

